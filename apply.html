<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Apply | BMBG State 620</title><link rel='stylesheet' href='styles.css'></head><body><main class='wrap'><a class='back' href='index.html'>← Home</a><section class='card'><div class='badge'>MIGRATION APPLICATION</div><h1>Apply to State 620</h1><p>Complete the details below. Your application is private to the migration team.</p><form id='migrationForm'><label>In-game name<input name='in_game_name' required></label><label>User ID number<input name='user_id' required></label><label>Current clan<input name='current_clan' required></label><label>Current state<input name='current_state' inputmode='numeric' required></label><label>Preferred clan in State 620<input name='preferred_clan' required></label><label>Backup clan<input name='backup_clan'></label><label>Total power<input name='total_power' required placeholder='e.g. 250M'></label><label>First march power<input name='first_march_power' required placeholder='e.g. 35M'></label><label>Second march power<input name='second_march_power' placeholder='e.g. 28M'></label><label>Bag screenshots<input id='bagImages' type='file' accept='image/*' multiple></label><small>You can select multiple screenshots.</small><button class='btn' type='submit'>Submit Application</button><p id='message'></p></form></section></main><script src='config.js'></script><script src='app.js'></script></body></html>
